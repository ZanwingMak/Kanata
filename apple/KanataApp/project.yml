name: KanataApp
options:
  bundleIdPrefix: com.kanata
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KanataCore:
    path: ../KanataCore
  KanataRender:
    path: ../KanataRender

targets:
  KanataApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: KanataCore
        product: KanataCore
      - package: KanataRender
        product: KanataRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanata.app
        DEVELOPMENT_TEAM: 2Q2LMV7BR6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Kanata.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconAurora AppIconSunset"
        DANDANPLAY_APP_ID: ""
        DANDANPLAY_APP_SECRET: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "18"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于连接局域网内的弹幕网关与 NAS 媒体源"
        INFOPLIST_KEY_UIBackgroundModes: audio
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kanata iOS App Store iCloud
    info:
      path: Sources/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        DandanplayAppId: $(DANDANPLAY_APP_ID)
        DandanplayAppSecret: $(DANDANPLAY_APP_SECRET)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            AppIconAurora:
              CFBundleIconName: AppIconAurora
              CFBundleIconFiles:
                - AppIconAurora
              UIPrerenderedIcon: false
            AppIconSunset:
              CFBundleIconName: AppIconSunset
              CFBundleIconFiles:
                - AppIconSunset
              UIPrerenderedIcon: false
        # 允许连接局域网内以 HTTP 部署的自托管网关
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  KanataTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    dependencies:
      - package: KanataCore
        product: KanataCore
      - package: KanataRender
        product: KanataRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanata.app
        DEVELOPMENT_TEAM: 2Q2LMV7BR6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Kanata.entitlements
        PRODUCT_NAME: Kanata
        DANDANPLAY_APP_ID: ""
        DANDANPLAY_APP_SECRET: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "18"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于连接局域网内的弹幕网关与 NAS 媒体源"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kanata tvOS App Store iCloud
    info:
      path: Sources/Info-tvOS.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        DandanplayAppId: $(DANDANPLAY_APP_ID)
        DandanplayAppSecret: $(DANDANPLAY_APP_SECRET)
        TVTopShelfImage:
          TVTopShelfPrimaryImage: Top Shelf Image
          TVTopShelfPrimaryImageWide: Top Shelf Image Wide
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
